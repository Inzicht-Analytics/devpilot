name: Foundation CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
        working-directory: services/agent
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate reproducible dependency lockfile
        working-directory: apps/dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile for review and commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devpilot-dashboard-lockfile
          path: apps/dashboard/package-lock.json
          if-no-files-found: error
      - name: Install from generated lockfile
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
